name: Deploy CLT-PJ Calculator to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore site HTML
        run: |
          cat site/chunks/*.txt | base64 -d | gzip -d > index.html
          mkdir -p assets
          base64 -d assets/doacao-qr.png.b64 > assets/doacao-qr.png
      - name: Apply compact iPhone first-screen layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("index.html")
          s = p.read_text()
          s = re.sub(r'<style id="iphone-compact-layout">.*?</style>', '', s, flags=re.S)
          s = re.sub(r'<script id="iphone-compact-layout-script">.*?</script>', '', s, flags=re.S)
          style = """<style id="iphone-compact-layout">
          @media (max-width: 600px) {
            html { font-size: 13px; overflow-y: auto !important; height: auto !important; }
            body { font-size: 13px; overflow-y: auto !important; overflow-x: hidden !important; height: auto !important; min-height: 100dvh !important; }
            header { display: none !important; }
            .mobile-hero { padding: 9px 14px !important; margin: 6px 0 8px !important; border-radius: 15px !important; min-height: 0 !important; max-height: none !important; height: auto !important; overflow: visible !important; }
            .mobile-hero h1 { display: block !important; font-size: 1.55rem !important; line-height: 1.08 !important; margin: 0 0 3px !important; }
            .mobile-hero p { font-size: .76rem !important; line-height: 1.15 !important; margin: 0 !important; }
            .mobile-hero .mobile-kicker { display: none !important; }
            .mobile-step { padding: 9px 5px !important; min-height: 0 !important; border-radius: 15px !important; }
            .mobile-step * { font-size: .78rem !important; line-height: 1.12 !important; }
            button, input, select, textarea { font-size: .9rem !important; }
          }
          .donate-launch { position: fixed; right: 14px; bottom: 18px; z-index: 9998; border: 0; border-radius: 999px; padding: 12px 18px; background: #173454; color: white; font: 600 15px system-ui,sans-serif; box-shadow: 0 4px 18px #0003; }
          .donate-screen { position: fixed; inset: 0; z-index: 10000; display: none; align-items: center; justify-content: center; padding: 22px; background: #f4f6f9; color: #172b46; font-family: system-ui,sans-serif; text-align: center; }
          .donate-screen.is-open { display: flex; }
          .donate-card { width: min(100%, 430px); padding: 24px 18px; background: white; border-radius: 22px; box-shadow: 0 12px 40px #10243a20; }
          .donate-card h2 { font-size: 1.35rem; line-height: 1.3; margin: 0 0 18px; }
          .donate-card img { display: block; width: min(76vw, 300px); height: auto; margin: 0 auto 18px; image-rendering: pixelated; }
          .donate-return { border: 0; border-radius: 999px; padding: 12px 28px; background: #173454; color: white; font-size: 15px; font-weight: 600; }
          #cltpj-mode-switch { margin: 12px 0 16px; padding: 13px; border: 1px solid #d9e1ea; border-radius: 14px; background: #fff; color: #173454; font-family: system-ui,sans-serif; }
          #cltpj-mode-switch .mode-heading { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
          #cltpj-mode-switch .mode-buttons { display: flex; gap: 8px; }
          #cltpj-mode-switch button { flex: 1; border: 1px solid #b9c8d8; border-radius: 10px; padding: 10px 8px; background: #f4f7fb; color: #173454; font-size: 14px; font-weight: 650; }
          #cltpj-mode-switch button.active { background: #173454; border-color: #173454; color: white; }
          #cltpj-mode-switch .mode-hint { margin-top: 8px; color: #617187; font-size: 11px; line-height: 1.35; }
          #cltpj-restart { position: fixed; left: 14px; bottom: 18px; z-index: 9998; border: 1px solid #cbd6e2; border-radius: 999px; padding: 11px 16px; background: #fff; color: #173454; font: 650 14px system-ui,sans-serif; box-shadow: 0 4px 18px #0002; }
          </style>"""
          script = """<script id="iphone-compact-layout-script">
          document.addEventListener('DOMContentLoaded', function () {
            const norm = s => (s || '').replace(/\\s+/g, ' ').trim();
            const heading = Array.from(document.querySelectorAll('h1,h2')).find(el => /quanto vale\\s+seu trabalho/i.test(norm(el.textContent)));
            if (heading) {
              let node = heading;
              for (let i = 0; i < 6 && node; i++, node = node.parentElement) {
                const bg = getComputedStyle(node).backgroundColor;
                const rect = node.getBoundingClientRect();
                if (rect.width > innerWidth * .75 && rect.height > 100 && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent') {
                  node.classList.add('mobile-hero');
                  heading.textContent = 'Calculadora PJ-CLT';
                  heading.style.setProperty('display', 'block', 'important');
                  heading.style.setProperty('font-size', '1.55rem', 'important');
                  const kicker = Array.from(node.querySelectorAll('*')).find(el => el.children.length === 0 && /simulador de remuneração/i.test(norm(el.textContent)));
                  if (kicker) kicker.classList.add('mobile-kicker');
                  const paragraphs = Array.from(node.querySelectorAll('p'));
                  if (paragraphs.length) paragraphs[paragraphs.length - 1].textContent = 'Compare CLT e PJ.';
                  break;
                }
              }
            }
            // Default PLR to one gross salary, while keeping the field editable.
            const plrInput = Array.from(document.querySelectorAll('input')).find(input => {
              const context = [
                input.id, input.name, input.getAttribute('aria-label'),
                ...(input.labels ? Array.from(input.labels).map(x => x.textContent) : []),
                input.parentElement ? input.parentElement.innerText : '',
                input.parentElement && input.parentElement.parentElement ? input.parentElement.parentElement.innerText : ''
              ].join(' ');
              return /PLR/i.test(context);
            });
            if (plrInput && (!plrInput.value || Number(plrInput.value.replace(',', '.')) === 0)) {
              const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;
              setter.call(plrInput, '1');
              plrInput.defaultValue = '1';
              plrInput.dispatchEvent(new Event('input', { bubbles: true }));
              plrInput.dispatchEvent(new Event('change', { bubbles: true }));
            }
            // Clear both CLT salary and PJ monthly billing defaults.
            for (const input of document.querySelectorAll('input')) {
              const context = [
                input.id, input.name, input.getAttribute('aria-label'), input.placeholder,
                ...(input.labels ? Array.from(input.labels).map(x => x.textContent) : []),
                input.parentElement ? input.parentElement.innerText : '',
                input.parentElement && input.parentElement.parentElement ? input.parentElement.parentElement.innerText : ''
              ].join(' ');
              if (!/PLR/i.test(context) && /sal[aá]rio|faturamento/i.test(context)) {
                const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;
                setter.call(input, '');
                input.defaultValue = '';
                input.removeAttribute('value');
                input.dispatchEvent(new Event('input', { bubbles: true }));
                input.dispatchEvent(new Event('change', { bubbles: true }));
              }
            }
            const labels = ['Comparação', 'Configuração PJ', 'Resultado', 'Memória'];
            for (const label of labels) {
              const el = Array.from(document.querySelectorAll('body *')).find(x => x.children.length === 0 && norm(x.textContent) === label);
              if (!el) continue;
              let node = el;
              for (let i = 0; i < 4 && node; i++, node = node.parentElement) {
                const rect = node.getBoundingClientRect();
                if (rect.width > 55 && rect.width < innerWidth * .55 && rect.height > 35) {
                  node.classList.add('mobile-step');
                  break;
                }
              }
            }
            const launch = document.createElement('button');
            launch.className = 'donate-launch';
            launch.type = 'button';
            launch.textContent = '♥ Doar R$ 1';
            const screen = document.createElement('section');
            screen.className = 'donate-screen';
            screen.setAttribute('role', 'dialog');
            screen.setAttribute('aria-modal', 'true');
            screen.innerHTML = '<div class="donate-card"><h2>Se você gostou, considere doar 1 real usando o QR code abaixo.</h2><img src="assets/doacao-qr.png" alt="QR code para doação de um real"><button type="button" class="donate-return">Voltar</button></div>';
            document.body.appendChild(launch);
            document.body.appendChild(screen);
            launch.addEventListener('click', () => { screen.classList.add('is-open'); });
            screen.querySelector('.donate-return').addEventListener('click', () => { screen.classList.remove('is-open'); });

            // Simplified / Advanced configuration switch. It only changes visibility,
            // preserving entered values and leaving all calculation logic untouched.
            const modeBar = document.createElement('div');
            modeBar.id = 'cltpj-mode-switch';
            modeBar.innerHTML = '<div class="mode-heading">Nível de configuração</div><div class="mode-buttons"><button type="button" data-mode="simple" aria-pressed="true">Simplificado</button><button type="button" data-mode="advanced" aria-pressed="false">Avançado</button></div><div class="mode-hint">O modo simplificado mostra apenas os dados essenciais. Use Avançado para visualizar os parâmetros tributários adicionais.</div>';
            const firstInput = document.querySelector('input, select, textarea');
            if (firstInput) {
              let anchorNode = firstInput;
              for (let i = 0; i < 5 && anchorNode.parentElement; i++) {
                const p = anchorNode.parentElement;
                if (p.getBoundingClientRect().width > innerWidth * .75) anchorNode = p;
                else break;
              }
              anchorNode.parentElement.insertBefore(modeBar, anchorNode);
            } else {
              document.body.insertBefore(modeBar, document.body.firstChild);
            }
            const advancedPattern = /pr[oó][- ]?labore|munic[ií]pio|cnae|fator\\s*r|receita\\s*(bruta\\s*)?(acumulada|12\\s*meses)|rbt12|folha\\s*(de\\s*)?(pagamento|sal[aá]rios)|anexo\\s*(iii|iv|v)|hist[oó]rico\\s*(de\\s*)?(faturamento|receita)/i;
            const fieldBlocks = [];
            for (const control of document.querySelectorAll('input, select, textarea')) {
              const labelText = [
                control.id, control.name, control.getAttribute('aria-label'), control.placeholder,
                ...(control.labels ? Array.from(control.labels).map(l => l.textContent) : []),
                control.parentElement ? control.parentElement.innerText : '',
                control.parentElement?.parentElement ? control.parentElement.parentElement.innerText : ''
              ].join(' ');
              if (!advancedPattern.test(labelText)) continue;
              let block = control;
              for (let i = 0; i < 4 && block.parentElement; i++) {
                const candidate = block.parentElement;
                const text = norm(candidate.innerText);
                if (text.length > 0 && text.length < 260 && candidate.querySelector('input,select,textarea') === control) {
                  block = candidate;
                  break;
                }
                block = candidate;
              }
              if (!fieldBlocks.includes(block)) fieldBlocks.push(block);
            }
            function setConfigMode(mode) {
              const advanced = mode === 'advanced';
              fieldBlocks.forEach(el => { el.style.display = advanced ? '' : 'none'; });
              modeBar.querySelectorAll('button[data-mode]').forEach(btn => {
                const active = btn.dataset.mode === mode;
                btn.setAttribute('aria-pressed', String(active));
                btn.classList.toggle('active', active);
              });
              modeBar.querySelector('.mode-hint').textContent = advanced
                ? 'Parâmetros tributários adicionais visíveis. Os valores preenchidos são preservados.'
                : 'Visualização essencial. Os parâmetros avançados ficam ocultos, sem apagar seus valores.';
            }
            modeBar.querySelectorAll('button[data-mode]').forEach(btn => btn.addEventListener('click', () => setConfigMode(btn.dataset.mode)));
            setConfigMode('simple');

            const restart = document.createElement('button');
            restart.type = 'button';
            restart.id = 'cltpj-restart';
            restart.textContent = '↺ Reiniciar';
            const suggestedDefaults = new Map();
            function controlContext(control) {
              return [control.id, control.name, control.getAttribute('aria-label'), control.placeholder,
                ...(control.labels ? Array.from(control.labels).map(l => l.textContent) : ''),
                control.parentElement?.innerText || '', control.parentElement?.parentElement?.innerText || '',
                control.parentElement?.parentElement?.parentElement?.innerText || ''].join(' ');
            }
            function assignControl(control, value) {
              const proto = control.tagName === 'TEXTAREA' ? HTMLTextAreaElement.prototype : control.tagName === 'SELECT' ? HTMLSelectElement.prototype : HTMLInputElement.prototype;
              const setter = Object.getOwnPropertyDescriptor(proto, 'value')?.set;
              if (setter) setter.call(control, String(value)); else control.value = String(value);
              control.dispatchEvent(new Event('input', { bubbles: true }));
              control.dispatchEvent(new Event('change', { bubbles: true }));
            }
            restart.addEventListener('click', () => {
              document.querySelectorAll('form').forEach(form => form.reset());
              for (const control of document.querySelectorAll('input,select,textarea')) {
                if (suggestedDefaults.has(control)) assignControl(control, suggestedDefaults.get(control));
              }
              setConfigMode('simple');
              screen.classList.remove('is-open');
              const firstStep = Array.from(document.querySelectorAll('button,[role="button"],a')).find(el => /^(1\\s*)?compara[çc][ãa]o$/i.test(norm(el.innerText || el.textContent)));
              if (firstStep) firstStep.click();
              window.scrollTo({ top: 0, behavior: 'smooth' });
            });
            document.body.appendChild(restart);

            function clearPJDefault() {
              for (const control of document.querySelectorAll('input')) {
                const ctx = [control.id, control.name, control.getAttribute('aria-label'), control.placeholder, ...(control.labels ? Array.from(control.labels).map(l => l.textContent) : ''), control.parentElement?.innerText || '', control.parentElement?.parentElement?.innerText || '', control.parentElement?.parentElement?.parentElement?.innerText || '', control.parentElement?.parentElement?.parentElement?.parentElement?.innerText || ''].join(' ');
                const value = norm(control.value).replace(/[^0-9,.-]/g, '').replace(',', '.');
                const pjContext = /PJ|pessoa jur[ií]dica|faturamento/i.test(ctx);
                if (((/sal[aá]rio|faturamento|receita/i.test(ctx)) && pjContext) || value === '12000') {
                  if (control.value !== '') {
                    Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set.call(control, '');
                    control.removeAttribute('value');
                    control.dispatchEvent(new Event('input', { bubbles: true }));
                    control.dispatchEvent(new Event('change', { bubbles: true }));
                  }
                }
              }
            }
            clearPJDefault();

            // Restore the editable suggested values that were part of the initial calculator.
            // Salary and PJ billing intentionally remain blank.
            for (const control of document.querySelectorAll('input,select,textarea')) {
              const ctx = controlContext(control);
              if (/PLR/i.test(ctx)) assignControl(control, '1');
              else if (/plano\\s*(de\\s*)?sa[uú]de|assist[eê]ncia\\s*m[eé]dica/i.test(ctx)) assignControl(control, '800');
              else if (/vale.?refei[cç][ãa]o|VR\\b/i.test(ctx)) assignControl(control, '1000');
              else if (/contabilidade/i.test(ctx)) assignControl(control, '300');
            }
            const proLaboreControl = Array.from(document.querySelectorAll('input')).find(control => {
              const ctx = [control.id, control.name, control.getAttribute('aria-label'), ...(control.labels ? Array.from(control.labels).map(l => l.textContent) : ''), control.parentElement?.innerText || '', control.parentElement?.parentElement?.innerText || ''].join(' ');
              return /pr[oó][- ]?labore/i.test(ctx);
            });
            if (proLaboreControl) {
              const ctx = [proLaboreControl.id, proLaboreControl.name, proLaboreControl.getAttribute('aria-label'), ...(proLaboreControl.labels ? Array.from(proLaboreControl.labels).map(l => l.textContent) : ''), proLaboreControl.parentElement?.innerText || '', proLaboreControl.parentElement?.parentElement?.innerText || ''].join(' ');
              const current = Number(norm(proLaboreControl.value).replace(/[^0-9,.-]/g, '').replace(',', '.')) || 0;
              if (/%|percentual|percent/i.test(ctx) || current <= 100) {
                Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set.call(proLaboreControl, '28');
                proLaboreControl.dispatchEvent(new Event('input', { bubbles: true }));
                proLaboreControl.dispatchEvent(new Event('change', { bubbles: true }));
              }
            }

            for (const control of document.querySelectorAll('input,select,textarea')) suggestedDefaults.set(control, control.value);

            function currencyValue(text) {
              const m = (text || '').match(/R\\$\\s*([\\d.]+,\\d{2})/);
              return m ? Number(m[1].replace(/\\./g, '').replace(',', '.')) : null;
            }
            function metricCard(pattern) {
              const candidates = Array.from(document.querySelectorAll('body *')).filter(el => el.children.length === 0 && pattern.test(norm(el.textContent)));
              for (const label of candidates) {
                let node = label;
                for (let i = 0; i < 5 && node; i++, node = node.parentElement) {
                  const txt = norm(node.innerText);
                  if (txt.length < 500 && /R\\$/.test(txt)) return node;
                }
              }
              return null;
            }
            function correctEconomicPJ() {
              const cltCard = metricCard(/total econ[oô]mico.*CLT|CLT.*total econ[oô]mico/i);
              const pjCard = metricCard(/total econ[oô]mico.*PJ|PJ.*total econ[oô]mico/i);
              const fgtsCard = metricCard(/FGTS anual|total de FGTS|FGTS/i);
              if (!cltCard || !pjCard || !fgtsCard) return;
              const clt = currencyValue(cltCard.innerText);
              const fgts = currencyValue(fgtsCard.innerText);
              if (clt === null || fgts === null) return;
              const target = Math.max(0, clt - fgts);
              const leaves = Array.from(pjCard.querySelectorAll('*')).filter(el => el.children.length === 0 && /R\\$\\s*[\\d.]+,\\d{2}/.test(el.textContent));
              const valueNode = leaves.sort((a,b) => a.textContent.length - b.textContent.length)[0];
              if (valueNode) {
                const formatted = target.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                if (norm(valueNode.textContent) !== formatted) valueNode.textContent = formatted;
              }
            }
            const resultObserver = new MutationObserver(() => { clearPJDefault(); correctEconomicPJ(); });
            resultObserver.observe(document.body, { childList: true, subtree: true, characterData: true });
            setTimeout(correctEconomicPJ, 400);
            setTimeout(correctEconomicPJ, 1200);
          });
          </script>"""
          s = s.replace(chr(92) + "n</head>", chr(10) + "</head>")
          s = s.replace(chr(92) + "n</body>", chr(10) + "</body>")
          s = s.replace("</head>", style + chr(10) + "</head>", 1) if "</head>" in s else style + s
          s = s.replace("</body>", script + chr(10) + "</body>", 1) if "</body>" in s else s + script
          p.write_text(s)
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
