name: Deploy CLT-PJ Calculator to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore site HTML
        run: |
          cat site/chunks/*.txt | base64 -d | gzip -d > index.html
          mkdir -p assets
          base64 -d assets/doacao-qr.png.b64 > assets/doacao-qr.png
      - name: Apply compact iPhone first-screen layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("index.html")
          s = p.read_text()
          s = re.sub(r'<style id="iphone-compact-layout">.*?</style>', '', s, flags=re.S)
          s = re.sub(r'<script id="iphone-compact-layout-script">.*?</script>', '', s, flags=re.S)
          style = """<style id="iphone-compact-layout">
          @media (max-width: 600px) {
            html { font-size: 13px; overflow-y: auto !important; height: auto !important; }
            body { font-size: 13px; overflow-y: auto !important; overflow-x: hidden !important; height: auto !important; min-height: 100dvh !important; }
            header { display: none !important; }
            .mobile-hero { padding: 9px 14px !important; margin: 6px 0 8px !important; border-radius: 15px !important; min-height: 0 !important; max-height: none !important; height: auto !important; overflow: visible !important; }
            .mobile-hero h1 { display: block !important; font-size: 1.55rem !important; line-height: 1.08 !important; margin: 0 0 3px !important; }
            .mobile-hero p { font-size: .76rem !important; line-height: 1.15 !important; margin: 0 !important; }
            .mobile-hero .mobile-kicker { display: none !important; }
            .mobile-step { padding: 9px 5px !important; min-height: 0 !important; border-radius: 15px !important; }
            .mobile-step * { font-size: .78rem !important; line-height: 1.12 !important; }
            button, input, select, textarea { font-size: .9rem !important; }
          }
          .donate-launch { position: fixed; right: 14px; bottom: 18px; z-index: 9998; border: 0; border-radius: 999px; padding: 12px 18px; background: #173454; color: white; font: 600 15px system-ui,sans-serif; box-shadow: 0 4px 18px #0003; }
          .donate-screen { position: fixed; inset: 0; z-index: 10000; display: none; align-items: center; justify-content: center; padding: 22px; background: #f4f6f9; color: #172b46; font-family: system-ui,sans-serif; text-align: center; }
          .donate-screen.is-open { display: flex; }
          .donate-card { width: min(100%, 430px); padding: 24px 18px; background: white; border-radius: 22px; box-shadow: 0 12px 40px #10243a20; }
          .donate-card h2 { font-size: 1.35rem; line-height: 1.3; margin: 0 0 18px; }
          .donate-card img { display: block; width: min(76vw, 300px); height: auto; margin: 0 auto 18px; image-rendering: pixelated; }
          .donate-return { border: 0; border-radius: 999px; padding: 12px 28px; background: #173454; color: white; font-size: 15px; font-weight: 600; }
          </style>"""
          script = """<script id="iphone-compact-layout-script">
          document.addEventListener('DOMContentLoaded', function () {
            const norm = s => (s || '').replace(/\\s+/g, ' ').trim();
            const heading = Array.from(document.querySelectorAll('h1,h2')).find(el => /quanto vale\\s+seu trabalho/i.test(norm(el.textContent)));
            if (heading) {
              let node = heading;
              for (let i = 0; i < 6 && node; i++, node = node.parentElement) {
                const bg = getComputedStyle(node).backgroundColor;
                const rect = node.getBoundingClientRect();
                if (rect.width > innerWidth * .75 && rect.height > 100 && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent') {
                  node.classList.add('mobile-hero');
                  heading.textContent = 'Calculadora PJ-CLT';
                  heading.style.setProperty('display', 'block', 'important');
                  heading.style.setProperty('font-size', '1.55rem', 'important');
                  const kicker = Array.from(node.querySelectorAll('*')).find(el => el.children.length === 0 && /simulador de remuneração/i.test(norm(el.textContent)));
                  if (kicker) kicker.classList.add('mobile-kicker');
                  const paragraphs = Array.from(node.querySelectorAll('p'));
                  if (paragraphs.length) paragraphs[paragraphs.length - 1].textContent = 'Compare CLT e PJ.';
                  break;
                }
              }
            }
            // Default PLR to one gross salary, while keeping the field editable.
            const plrInput = Array.from(document.querySelectorAll('input')).find(input => {
              const context = [
                input.id, input.name, input.getAttribute('aria-label'),
                ...(input.labels ? Array.from(input.labels).map(x => x.textContent) : []),
                input.parentElement ? input.parentElement.innerText : '',
                input.parentElement && input.parentElement.parentElement ? input.parentElement.parentElement.innerText : ''
              ].join(' ');
              return /PLR/i.test(context);
            });
            if (plrInput && (!plrInput.value || Number(plrInput.value.replace(',', '.')) === 0)) {
              const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;
              setter.call(plrInput, '1');
              plrInput.defaultValue = '1';
              plrInput.dispatchEvent(new Event('input', { bubbles: true }));
              plrInput.dispatchEvent(new Event('change', { bubbles: true }));
            }
            // Clear both CLT salary and PJ monthly billing defaults.
            for (const input of document.querySelectorAll('input')) {
              const context = [
                input.id, input.name, input.getAttribute('aria-label'), input.placeholder,
                ...(input.labels ? Array.from(input.labels).map(x => x.textContent) : []),
                input.parentElement ? input.parentElement.innerText : '',
                input.parentElement && input.parentElement.parentElement ? input.parentElement.parentElement.innerText : ''
              ].join(' ');
              if (!/PLR/i.test(context) && /sal[aá]rio|faturamento/i.test(context)) {
                const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;
                setter.call(input, '');
                input.defaultValue = '';
                input.removeAttribute('value');
                input.dispatchEvent(new Event('input', { bubbles: true }));
                input.dispatchEvent(new Event('change', { bubbles: true }));
              }
            }
            const labels = ['Comparação', 'Configuração PJ', 'Resultado', 'Memória'];
            for (const label of labels) {
              const el = Array.from(document.querySelectorAll('body *')).find(x => x.children.length === 0 && norm(x.textContent) === label);
              if (!el) continue;
              let node = el;
              for (let i = 0; i < 4 && node; i++, node = node.parentElement) {
                const rect = node.getBoundingClientRect();
                if (rect.width > 55 && rect.width < innerWidth * .55 && rect.height > 35) {
                  node.classList.add('mobile-step');
                  break;
                }
              }
            }
            const launch = document.createElement('button');
            launch.className = 'donate-launch';
            launch.type = 'button';
            launch.textContent = '♥ Doar R$ 1';
            const screen = document.createElement('section');
            screen.className = 'donate-screen';
            screen.setAttribute('role', 'dialog');
            screen.setAttribute('aria-modal', 'true');
            screen.innerHTML = '<div class="donate-card"><h2>Se você gostou, considere doar 1 real usando o QR code abaixo.</h2><img src="assets/doacao-qr.png" alt="QR code para doação de um real"><button type="button" class="donate-return">Voltar</button></div>';
            document.body.appendChild(launch);
            document.body.appendChild(screen);
            launch.addEventListener('click', () => { screen.classList.add('is-open'); });
            screen.querySelector('.donate-return').addEventListener('click', () => { screen.classList.remove('is-open'); });
          });
          </script>"""
          s = s.replace(chr(92) + "n</head>", chr(10) + "</head>")
          s = s.replace(chr(92) + "n</body>", chr(10) + "</body>")
          s = s.replace("</head>", style + chr(10) + "</head>", 1) if "</head>" in s else style + s
          s = s.replace("</body>", script + chr(10) + "</body>", 1) if "</body>" in s else s + script
          p.write_text(s)
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
